<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Sentinel - Intraday Terminal</title>
    <!-- Tailwind CSS desde CDN para diseño ultrarrápido y limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0B0E14; color: #E2E8F0; font-family: 'Inter', sans-serif; }
        .card { background: #151A23; border: 1px solid #1E2638; }
        .accent-glow { box-shadow: 0 0 15px rgba(59, 130, 246, 0.15); }
    </style>
</head>
<body class="pb-20">

    <!-- Header / Top Bar -->
    <header class="p-4 border-b border-gray-800 bg-[#0F131C] sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
            <h1 class="font-bold text-lg tracking-wide text-white">ALPHA <span class="text-blue-500">SENTINEL</span></h1>
        </div>
        <span class="text-xs bg-blue-500/10 text-blue-400 px-2 py-1 rounded border border-blue-500/20">Modo Intraday</span>
    </header>

    <!-- Contenido Principal -->
    <main class="p-4 space-y-4 max-w-md mx-auto">

        <!-- Radar de Riesgo de Mercado -->
        <section>
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Monitoreo en Tiempo Real</h2>
            <div class="grid grid-cols-2 gap-3">
                <div class="card p-3 rounded-xl">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-gray-200">BTC/USD</span>
                        <span class="text-xs text-emerald-400 font-mono">+1.2%</span>
                    </div>
                    <div class="mt-2 text-xl font-bold text-white font-mono">$68,450</div>
                    <div class="mt-2 flex justify-between text-[10px] text-gray-400">
                        <span>RSI: <b class="text-gray-200">58.4</b></span>
                        <span>Riesgo: <b class="text-emerald-400">BAJO</b></span>
                    </div>
                </div>

                <div class="card p-3 rounded-xl">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-gray-200">XAUUSD</span>
                        <span class="text-xs text-red-400 font-mono">-0.4%</span>
                    </div>
                    <div class="mt-2 text-xl font-bold text-white font-mono">$2,735.10</div>
                    <div class="mt-2 flex justify-between text-[10px] text-gray-400">
                        <span>RSI: <b class="text-amber-400">68.1</b></span>
                        <span>Riesgo: <b class="text-amber-400">MEDIO</b></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Calculadora de Loteaje Intraday -->
        <section class="card p-4 rounded-xl accent-glow">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-calculator text-blue-500"></i> Calculadora de Riesgo
                </h2>
                <span class="text-[10px] text-gray-400">Regla 1% Capital</span>
            </div>

            <div class="space-y-3 text-xs">
                <div>
                    <label class="text-gray-400 block mb-1">Balance de Cuenta ($)</label>
                    <input type="number" id="balance" value="10000" class="w-full bg-[#0B0E14] border border-gray-700 rounded p-2 text-white font-mono outline-none focus:border-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-gray-400 block mb-1">Riesgo (%)</label>
                        <input type="number" id="riesgo" value="1" class="w-full bg-[#0B0E14] border border-gray-700 rounded p-2 text-white font-mono outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="text-gray-400 block mb-1">Stop Loss (Pips/Pts)</label>
                        <input type="number" id="sl" value="25" class="w-full bg-[#0B0E14] border border-gray-700 rounded p-2 text-white font-mono outline-none focus:border-blue-500">
                    </div>
                </div>

                <button onclick="calcularRiesgo()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-lg transition-all">
                    Calcular Posición
                </button>

                <div id="resultado" class="hidden mt-3 p-3 bg-blue-950/30 border border-blue-500/30 rounded-lg text-center">
                    <div class="text-gray-400 text-[10px]">Riesgo Máximo: <b id="montoRiesgo" class="text-white">$100</b></div>
                    <div class="text-base font-bold text-emerald-400 mt-1 font-mono" id="loteSugerido">0.40 Lotes</div>
                </div>
            </div>
        </section>

        <!-- Feed del Canal de Notificaciones integradas -->
        <section class="card p-4 rounded-xl">
            <h2 class="text-sm font-bold text-white mb-2 flex items-center gap-2">
                <i class="fa-solid fa-bell text-amber-400"></i> Feed de Alertas Recientes
            </h2>
            <iframe src="https://ntfy.sh/mi_trading_bot_alerta_998822" class="w-full h-64 rounded bg-[#0B0E14] border border-gray-800"></iframe>
        </section>

    </main>

    <!-- Bottom Navigation Bar (Fija abajo) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#0F131C] border-t border-gray-800 p-2 flex justify-around text-xs z-50">
        <button class="flex flex-col items-center text-blue-400">
            <i class="fa-solid fa-chart-line text-base"></i>
            <span class="text-[10px] mt-1">Mercados</span>
        </button>
        <button class="flex flex-col items-center text-gray-500 hover:text-gray-300">
            <i class="fa-solid fa-calculator text-base"></i>
            <span class="text-[10px] mt-1">Riesgo</span>
        </button>
        <button class="flex flex-col items-center text-gray-500 hover:text-gray-300">
            <i class="fa-solid fa-newspaper text-base"></i>
            <span class="text-[10px] mt-1">Noticias</span>
        </button>
    </nav>

    <script>
        function calcularRiesgo() {
            const balance = parseFloat(document.getElementById('balance').value);
            const riesgoPct = parseFloat(document.getElementById('riesgo').value);
            const slPips = parseFloat(document.getElementById('sl').value);

            if (!balance || !riesgoPct || !slPips) return;

            const dineroRiesgo = (balance * (riesgoPct / 100));
            // Cálculo estándar aproximado para pares/índices
            const lotes = (dineroRiesgo / (slPips * 10)).toFixed(2);

            document.getElementById('montoRiesgo').innerText = `$${dineroRiesgo.toFixed(2)}`;
            document.getElementById('loteSugerido').innerText = `${lotes} Lotes / Contratos`;
            document.getElementById('resultado').classList.remove('hidden');
        }
    </script>
</body>
</html>
